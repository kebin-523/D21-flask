<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 탭 제목: 자식 화면이 title 칸을 채우면 그 글자가 앞에 붙어요. -->
  <title>{% block title %}{% endblock %} | 클래스로 마켓</title>
  <!-- static 폴더의 style.css를 url_for로 찾아서 불러와요. -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <!-- 모든 화면 위쪽에 똑같이 나오는 머리 부분이에요. -->
  <header class="site-header">
    <!-- 서비스 이름을 누르면 홈(home 함수)으로 가요. -->
    <a class="logo" href="{{ url_for('home') }}">클래스로 마켓</a>
    <!-- 메뉴: 주소를 직접 쓰지 않고 함수 이름으로 링크를 만들어요. -->
    <nav>
      <a href="{{ url_for('home') }}">홈</a>
      <a href="{{ url_for('classes') }}">클래스</a>
      <a href="{{ url_for('about') }}">소개</a>
      <!-- 찜 목록 링크예요. 괄호 안 숫자(wish_count)는 app.py가 모든 화면에 넣어 주는 찜 개수예요. -->
      <a href="{{ url_for('wishlist') }}">찜 목록 ({{ wish_count }})</a>
    </nav>
  </header>

  <!-- 여기가 빈칸이에요. 자식 화면이 content 칸에 본문을 채워 넣어요. -->
  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <!-- 모든 화면 아래쪽에 똑같이 나오는 바닥 글씨예요. -->
  <footer class="site-footer">
    © 2026 클래스로 마켓 · 배우고 싶은 모든 순간
  </footer>
</body>
</html>
